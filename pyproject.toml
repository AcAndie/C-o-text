[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cao-text"
version = "2.0.0"
description = "Công cụ chuẩn hóa nội dung tiểu thuyết từ web, EPUB, TXT sang Obsidian/translate/raw."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "curl_cffi>=0.7.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "playwright>=1.44.0",
    "playwright-stealth>=1.0.6",
    "google-genai>=1.0.0",
    "ebooklib>=0.18",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
cao-text = "cao_text.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cao_text*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests", "tools"]
extend-exclude = [
    "src/ai",
    "src/core",
    "src/ingest",
    "src/learning",
    "src/pipeline",
    "src/tools",
    "src/utils",
    "src/writers",
    "src/config.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
